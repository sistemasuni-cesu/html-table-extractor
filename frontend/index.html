<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Leitor de HTML</title>
</head>
<body>
  <h1>Enviar arquivo HTML</h1>
  <form id="uploadForm" enctype="multipart/form-data">
    <input type="file" name="file" accept=".html,.htm" required>
    <button type="submit">Enviar</button>
  </form>

  <h2>Resultado</h2>
  <div id="resultado"></div>

  <script>
    document.getElementById("uploadForm").addEventListener("submit", async (e) => {
      e.preventDefault();

      const formData = new FormData(e.target);

      const response = await fetch("https://html-table-extractor-3.onrender.com", {
      method: "POST",
      body: formData
      });

      const data = await response.json();

      let resultadoDiv = document.getElementById("resultado");
      resultadoDiv.innerHTML = "";

      if (data.message) {
        resultadoDiv.innerText = data.message;
      } else {
        data.forEach((table, index) => {
          let tableHTML = "<h3>Tabela " + (index+1) + "</h3><table border='1'>";
          table.forEach(row => {
            tableHTML += "<tr>";
            for (let col in row) {
              tableHTML += "<td>" + row[col] + "</td>";
            }
            tableHTML += "</tr>";
          });
          tableHTML += "</table>";
          resultadoDiv.innerHTML += tableHTML;
        });
      }
    });
  </script>
</body>
</html>
