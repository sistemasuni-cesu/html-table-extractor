<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Aproveitamento de Estudos</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
</head>
<body>
    <h1>Sistema de Aproveitamento de Estudos</h1>
    
    <div class="container">
        <div class="tab-buttons">
            <button class="tab-button active" data-tab="extraction">Extração de Dados</button>
            <button class="tab-button" data-tab="organization">Organização</button>
            <button class="tab-button" data-tab="final">Resultado Final</button>
        </div>
        
        <div id="extractionTab" class="tab-content active">
            <h2>Extração de Dados do PDF</h2>
            
            <div>
                <label for="pdfUpload">Selecione o PDF de Aproveitamento:</label>
                <input type="file" id="pdfUpload" accept=".pdf" />
                <button id="extractButton">Extrair Dados</button>
            </div>
            
            <div>
                <h3>Dados Extraídos (Pré-visualização)</h3>
                <textarea id="dataPreview" readonly></textarea>
            </div>
            
            <div>
                <h3>Configurações</h3>
                <label for="course">Curso:</label>
                <select id="course">
                    <option value="0">GRADUAÇÃO EM ADMINISTRAÇÃO</option>
                    <option value="1">GRADUAÇÃO EM AGRONOMIA</option>
                    <option value="2">GRADUAÇÃO EM ARQUITETURA E URBANISMO</option>
                    <option value="3">GRADUAÇÃO EM BIOMEDICINA</option>
                    <option value="4">GRADUAÇÃO EM CIÊNCIAS CONTÁBEIS</option>
                    <option value="5">GRADUAÇÃO EM COMUNICAÇÃO SOCIAL</option>
                    <option value="6">GRADUAÇÃO EM DIREITO</option>
                    <option value="7">GRADUAÇÃO EM ENFERMAGEM</option>
                    <option value="8">GRADUAÇÃO EM ENGENHARIA CIVIL</option>
                    <option value="9">GRADUAÇÃO EM ENGENHARIA DE SOFTWARE</option>
                    <option value="10">GRADUAÇÃO EM ENGENHARIA MECÂNICA</option>
                    <option value="11">GRADUAÇÃO EM FARMÁCIA</option>
                    <option value="12">GRADUAÇÃO EM FISIOTERAPIA</option>
                    <option value="13">GRADUAÇÃO EM MEDICINA VETERINÁRIA</option>
                    <option value="14">GRADUAÇÃO EM NUTRIÇÃO</option>
                    <option value="15">GRADUAÇÃO EM ODONTOLOGIA</option>
                    <option value="16">GRADUAÇÃO EM PEDAGOGIA</option>
                    <option value="17">GRADUAÇÃO EM PSICOLOGIA</option>
                    <option value="18">SUPERIOR DE TECNOLOGIA EM ANÁLISE E DESENVOLVIMENTO DE SISTEMAS</option>
                    <option value="19">SUPERIOR DE TECNOLOGIA EM ESTÉTICA E COSMÉTICA</option>
                    <option value="20">SUPERIOR DE TECNOLOGIA EM PROCESSOS GERENCIAIS</option>
                </select>
                
                <label for="initialSeries">Série Inicial:</label>
                <select id="initialSeries">
                    <option value="1">1ª Série</option>
                    <option value="2">2ª Série</option>
                    <option value="3">3ª Série</option>
                    <option value="4">4ª Série</option>
                    <option value="5">5ª Série</option>
                    <option value="6">6ª Série</option>
                    <option value="7">7ª Série</option>
                    <option value="8">8ª Série</option>
                    <option value="9">9ª Série</option>
                    <option value="10">10ª Série</option>
                </select>
            </div>
            
            <button id="processButton">Processar Dados</button>
        </div>
        
        <div id="organizationTab" class="tab-content">
            <h2>Organização das Disciplinas</h2>
            
            <div id="resultsSection">
                <div class="tab-buttons">
                    <button class="tab-button active" data-tab="organized">Grade Organizada</button>
                    <button class="tab-button" data-tab="pending">Pendentes</button>
                </div>
                
                <div id="organizedResultsTab" class="tab-content active">
                    <div id="organizedResults"></div>
                    <button id="downloadButton">Baixar PDF da Grade</button>
                </div>
                
                <div id="pendingResultsTab" class="tab-content">
                    <div id="pendingResults"></div>
                </div>
                
                <button id="finalizeButton">Finalizar Ajustes</button>
            </div>
        </div>
        
        <div id="finalTab" class="tab-content">
            <h2>Resultado Final</h2>
            
            <div id="finalResults">
                <div id="finalResultsContent"></div>
                <button id="finalDownloadButton">Baixar PDF Final</button>
            </div>
        </div>
    </div>

    <script src="aproveitamento.js"></script>
</body>
</html>
